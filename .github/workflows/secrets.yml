name: Secrets Management
on: [workflow_dispatch]
# Workflow-level env is the default for all jobs.
env:
  GROQ_MODEL: openai/gpt-oss-120b
jobs:
  test:
    # prod can supply environment secrets/variables and require approval.
    environment: prod
    env:
      QDRANT_URL: ${{ vars.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Job env overrides the workflow default, even if this secret is unset.
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      PORT: ${{ secrets.PORT }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Get pnpm store
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run
        run: pnpm run build
      - name: Deploy
        run: |
          echo "Deploying rag app..."
          # Use shell variables for values that may contain special characters.
          echo "$GROQ_MODEL"
          echo "$QDRANT_URL"
          pnpm run start &
          pnpm dlx wait-on http://localhost:$PORT
          echo "RAG app is running"
