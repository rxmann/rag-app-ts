name: Output Workflow
on: [workflow_dispatch]
jobs:
  publish:
    runs-on: ubuntu-latest
    # Promote a named step output to a job output for downstream jobs.
    outputs:
      build_tag: ${{ steps.tagger.outputs.build_tag }}
    steps:
      - name: Setup Environment
        run: echo "Setting up environment"
      - name: Build Application
        run: echo "Building application"
      - name: Save Build Version
        id: tagger
        # id: tagger is the key used by steps.tagger.outputs above.
        run: echo "build_tag=v1.2.0" >> "$GITHUB_OUTPUT"
  consume:
    # needs both waits for publish and exposes its outputs.
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Consume Outputs
        run: |
          echo "Printing the build_tag"
          echo "${{ needs.publish.outputs.build_tag }}"
