name: Cache Dependencies

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      # GITHUB_ENV makes STORE_PATH available to subsequent steps in this job.
      - name: Get pnpm store
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      # Cache the download store; install still runs to create node_modules.
      # A changed lockfile produces a new cache key.
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run
        run: pnpm run build

      - name: Deploy
        run: echo "Deploying rag app..."

  # Intentional repetition: each job has a fresh runner. Compare artifact.yml
  # for passing build files, and reusable.yml for sharing workflow logic.
  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      # GITHUB_ENV makes STORE_PATH available to subsequent steps in this job.
      - name: Get pnpm store
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      # Cache the download store; install still runs to create node_modules.
      # A changed lockfile produces a new cache key.
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run
        run: pnpm run build

      - name: Deploy
        run: echo "Deploying rag app..."
