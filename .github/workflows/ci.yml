name: CI
on:
  workflow_dispatch:
    # Manual runs select a branch in the UI; branches is not a valid filter here.
# Earlier topic: issues can trigger workflows too, but does not support branches.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      # Deliberately repeated from the early lesson; later examples install once.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run
        run: pnpm run build
      - name: Deploy
        run: echo "Deploying rag app..."
  deploy:
    # Without needs, this job can run in parallel with typecheck.
    # Uncomment to make it wait for typecheck to succeed.
    # needs: [ typecheck ]
    runs-on: ubuntu-latest
    steps:
      - name: Output EventDetails
        # Event text can contain quotes or shell syntax: pass it through env.
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        run: printf '%s\n' "$EVENT_JSON"
