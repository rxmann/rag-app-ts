name: CI
on:
  workflow_dispatch:
    # workflow_dispatch does not support branches; choose a branch in the UI.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
  build:
    # needs orders jobs; it does not share files between their runners.
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run
        run: pnpm run build
      - name: Deploy
        run: echo "Deploying rag app..."
      # Artifacts transfer generated files between jobs (or let you download them).
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist
            package.json
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # This fresh runner receives the files uploaded by build.
      - name: Get upload artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
      - name: Output contents
        run: ls
      - name: Deploy
        run: echo "Deploying rag app..."
