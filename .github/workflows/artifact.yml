name: CI
on:
  workflow_dispatch:
    branches: [ "feature-*" ]
  push:
    branches: [ "feature-*" ]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Typecheck
        run: pnpm run typecheck
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
  build:
    needs: [ typecheck ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run
        run: pnpm run build
      - name: Deploy
        run: echo "Deploying rag app..."
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist
            package.json
  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Output EventDetails
        run: echo "${{ toJson(github.event) }}"
