# GitHub discovers workflows only directly inside .github/workflows.
# This workflow demonstrates executing a custom JavaScript Action defined in .github/actions/deploy-status.
name: JavaScript Custom Action Example
# Active lesson: run on pushes or manually (manual UI requires the default branch).
on: [ push, workflow_dispatch ]
# Read access is sufficient for checkout; prod settings belong to the deploy job.
permissions:
  contents: read

# Dependency chain: checks -> build -> deploy.
# Every job starts on a fresh runner VM.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      # Composite action reuses cached dependency setup.
      - name: Load & Cache Dependencies
        uses: ./.github/actions/cached-deps
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test (placeholder script)
        id: tests
        # package.json currently exits 1; tolerate failure for demonstration.
        continue-on-error: true
        run: pnpm run test
      # Outcome is raw result before tolerance; conclusion is final status.
      - name: Report tolerated test failure
        if: steps.tests.outcome == 'failure'
        run: echo "The placeholder test failed; this example can continue."
      - name: Failure diagnostics
        if: failure()
        run: echo "Dependency installation or typecheck failed."

  build:
    needs: [ checks ]
    if: success()
    runs-on: ubuntu-latest
    # Promote the step output to a job output for downstream jobs.
    outputs:
      build_tag: ${{ steps.build.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Load & Cache Dependencies
        uses: ./.github/actions/cached-deps
      - name: Build
        id: build
        run: |
          pnpm run build
          echo "build_tag=v1.2.0" >> "$GITHUB_OUTPUT"
      # Upload compiled dist/ directory as an artifact.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.build.outputs.build_tag }}
          path: dist/
          if-no-files-found: error

  deploy:
    needs: [ build ]
    if: success() && needs.build.outputs.build_tag != ''
    runs-on: ubuntu-latest
    # Selects environment secrets/variables and deployment protection rules.
    environment: prod
    env:
      QDRANT_URL: ${{ vars.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      PORT: ${{ secrets.PORT || '3000' }}
      BUILD_TAG: ${{ needs.build.outputs.build_tag }}
    outputs:
      release_id: ${{ steps.verify_deploy.outputs.release-id }}
      deploy_status: ${{ steps.verify_deploy.outputs.status }}
    steps:
      # Checkout is required first so the local JavaScript action exists on the runner filesystem.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
      - name: Load & Cache Dependencies
        uses: ./.github/actions/cached-deps
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.build.outputs.build_tag }}
          path: dist/
      - name: Deploy example (local smoke check)
        id: deploy
        # Run the downloaded build in background and verify HTTP readiness.
        run: |
          echo "Deploying rag app $BUILD_TAG..."
          node dist/server.js &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          pnpm dlx wait-on --timeout 60000 "http://localhost:$PORT"
          echo "deployment_url=http://localhost:$PORT" >> "$GITHUB_OUTPUT"

      # --- CUSTOM JAVASCRIPT ACTION STEP ---
      # Runs directly via Node.js on the runner VM as configured in action.yml (runs.using: 'node20').
      # Inputs are passed via 'with:'; secrets are safely passed and masked inside the JS action.
      - name: Verify Deployment with Custom JS Action
        id: verify_deploy
        uses: ./.github/actions/deploy-status
        with:
          app-name: 'rag-app'
          deployment-url: ${{ steps.deploy.outputs.deployment_url || format('http://localhost:{0}', env.PORT) }}
          auth-token: ${{ secrets.DEMO_TOKEN || secrets.GROQ_API_KEY }}
          environment: 'prod'

      # Downstream step consuming outputs produced by the JavaScript action.
      - name: Report JS Action Outputs
        if: success()
        env:
          STATUS: ${{ steps.verify_deploy.outputs.status }}
          RELEASE_ID: ${{ steps.verify_deploy.outputs.release-id }}
          SUMMARY: ${{ steps.verify_deploy.outputs.summary }}
        run: |
          echo "Status output:    $STATUS"
          echo "Release ID:       $RELEASE_ID"
          echo "Summary output:   $SUMMARY"

      - name: Failure diagnostics
        if: failure()
        run: echo "Deployment or JS action verification failed."

      - name: Final status
        if: always()
        run: echo "JavaScript action workflow finished."
