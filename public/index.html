<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Query</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #0d0d0d;
            --surface:  #161616;
            --border:   #2a2a2a;
            --accent:   #7c6aff;
            --accent-dim: rgba(124,106,255,.12);
            --text:     #e8e8e8;
            --muted:    #666;
            --error:    #ff6b6b;
            --radius:   12px;
            --mono:     'SF Mono', 'Fira Code', 'Menlo', monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: start center;
            padding: 48px 16px 80px;
        }

        .card {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 14px;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -.3px;
        }
        .badge {
            margin-left: auto;
            font-size: 11px;
            color: var(--muted);
            font-family: var(--mono);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 20px;
        }

        /* Input area */
        .input-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: border-color .15s;
        }
        .input-wrap:focus-within {
            border-color: var(--accent);
        }
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            padding: 16px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.6;
            font-family: inherit;
            min-height: 96px;
            max-height: 300px;
            overflow-y: auto;
        }
        textarea::placeholder { color: var(--muted); }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px 12px;
            border-top: 1px solid var(--border);
        }
        .hint { font-size: 12px; color: var(--muted); }
        .hint kbd {
            font-family: var(--mono);
            font-size: 11px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
        }

        button#ask {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity .15s, transform .1s;
        }
        button#ask:hover:not(:disabled) { opacity: .88; }
        button#ask:active:not(:disabled) { transform: scale(.97); }
        button#ask:disabled { opacity: .4; cursor: default; }

        /* Loader */
        .loader {
            display: none;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 14px;
        }
        .loader.visible { display: flex; }
        .dots { display: flex; gap: 4px; }
        .dots span {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes pulse {
            0%,100% { opacity: .2; transform: scale(.8); }
            50%      { opacity: 1;  transform: scale(1); }
        }

        /* Error */
        .error-box {
            display: none;
            background: rgba(255,107,107,.08);
            border: 1px solid rgba(255,107,107,.25);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-size: 14px;
            color: var(--error);
        }
        .error-box.visible { display: block; }

        /* Result */
        .result {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .result.visible { display: flex; }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .answer-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius);
            padding: 16px 18px;
            font-size: 15px;
            line-height: 1.75;
            color: var(--text);
        }

        .sources {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .source-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-dim);
            border: 1px solid rgba(124,106,255,.22);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            font-family: var(--mono);
            color: var(--accent);
        }
        .source-chip .page {
            font-size: 11px;
            opacity: .65;
        }

        @media (max-width: 480px) {
            body { padding-top: 24px; }
            h1 { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="card">
    <header>
        <div class="logo">⬡</div>
        <h1>RAG Query</h1>
        <span class="badge">local</span>
    </header>

    <div class="input-wrap">
        <textarea id="q" placeholder="Ask anything from your documents…" rows="3"></textarea>
        <div class="input-footer">
            <span class="hint"><kbd>⌘</kbd> + <kbd>Enter</kbd> to send</span>
            <button id="ask">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                    <path d="M14 8L2 2l3 6-3 6 12-6z" fill="currentColor"/>
                </svg>
                Ask
            </button>
        </div>
    </div>

    <div class="loader" id="loader">
        <div class="dots"><span></span><span></span><span></span></div>
        Thinking…
    </div>

    <div class="error-box" id="err"></div>

    <div class="result" id="result">
        <div>
            <div class="section-label">Answer</div>
            <div class="answer-box" id="answer"></div>
        </div>
        <div>
            <div class="section-label">Sources</div>
            <div class="sources" id="sources"></div>
        </div>
    </div>
</div>

<script>
    const q       = document.getElementById('q');
    const askBtn  = document.getElementById('ask');
    const loader  = document.getElementById('loader');
    const errBox  = document.getElementById('err');
    const result  = document.getElementById('result');
    const answer  = document.getElementById('answer');
    const sources = document.getElementById('sources');

    // Auto-resize textarea
    q.addEventListener('input', () => {
        q.style.height = 'auto';
        q.style.height = q.scrollHeight + 'px';
    });

    // Cmd/Ctrl + Enter shortcut
    q.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit();
    });

    askBtn.addEventListener('click', submit);

    async function submit() {
        const query = q.value.trim();
        if (!query) return;

        errBox.classList.remove('visible');
        result.classList.remove('visible');
        loader.classList.add('visible');
        askBtn.disabled = true;

        try {
            const res  = await fetch('/api/rag/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const data = await res.json();

            if (!res.ok) throw new Error(data.error || 'Request failed');

            answer.textContent = data.answer;
            sources.innerHTML  = data.sources.map(s => `
          <span class="source-chip">
            ${s.filename}<span class="page">${s.pageNumber != null ? ' p.' + s.pageNumber : ''}</span>
          </span>`).join('');

            result.classList.add('visible');
        } catch (e) {
            errBox.textContent = e.message;
            errBox.classList.add('visible');
        } finally {
            loader.classList.remove('visible');
            askBtn.disabled = false;
        }
    }
</script>
</body>
</html>
